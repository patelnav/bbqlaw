name = "bbqlaw-relay"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# Preview: https://bbqlaw-relay.<account>.workers.dev/api/...
# Production route (once bbqlaw.app DNS is live):
# routes = [{ pattern = "bbqlaw.app/api/*", zone_name = "bbqlaw.app" }]

[[kv_namespaces]]
binding = "RELAY"
id = "REPLACE_AFTER_KV_CREATE"
preview_id = "REPLACE_AFTER_KV_CREATE"

[vars]
PUBLIC_BASE_URL = "https://bbqlaw.app"

# For local dev, copy relay/.dev.vars.example → relay/.dev.vars (optional overrides).
