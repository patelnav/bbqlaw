name = "bbqlaw-relay"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# Preview: https://bbqlaw-relay.<account>.workers.dev/api/...
# Production route:
routes = [{ pattern = "bbqlaw.app/api/*", zone_name = "bbqlaw.app" }]

[[kv_namespaces]]
binding = "RELAY"
id = "eabf6ea0dd554e118e4f3a733be5c51a"
preview_id = "eabf6ea0dd554e118e4f3a733be5c51a"

# Opt-in thermometer captures. A 90-day lifecycle rule deletes them (README.md).
[[r2_buckets]]
binding = "CAPTURES"
bucket_name = "bbqlaw-captures"

[vars]
PUBLIC_BASE_URL = "https://bbqlaw.app"

# For local dev, copy relay/.dev.vars.example → relay/.dev.vars (optional overrides).
