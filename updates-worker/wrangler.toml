name = "bbqlaw-updates"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# Preview: https://bbqlaw-updates.<account>.workers.dev/manifest
# Production route (needs a proxied DNS record for updates.bbqlaw.app):
routes = [{ pattern = "updates.bbqlaw.app/*", zone_name = "bbqlaw.app" }]

# Read-only: this Worker never writes to the bucket and holds no keys.
[[r2_buckets]]
binding = "UPDATES"
bucket_name = "bbqlaw-updates"
